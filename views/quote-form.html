<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Quote | Apex Shield</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    
    body {
      background-color: #f1f5f9;
      background-image: 
        radial-gradient(at 50% 0%, rgba(37, 99, 235, 0.15) 0px, transparent 70%),
        radial-gradient(at 100% 0%, rgba(2, 132, 199, 0.12) 0px, transparent 50%),
        url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
      min-height: 100vh;
      color: #1e293b;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    /* Navigation Bar */
    nav { 
      width: 100%; 
      padding: 16px 50px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      background: #ffffff; 
      border-bottom: 2px solid #e2e8f0;
      box-shadow: 0 4px 20px rgba(15, 23, 42, 0.06);
    }
    
    .logo-shield {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.25);
      transition: transform 0.2s ease;
    }
    .logo:hover .logo-shield { transform: scale(1.05); }

    .logo-text { display: flex; flex-direction: column; }
    .brand-name { font-size: 22px; font-weight: 800; color: #0f172a; letter-spacing: -0.5px; line-height: 1.1; }
    .brand-tagline { font-size: 11px; font-weight: 700; color: #2563eb; text-transform: uppercase; letter-spacing: 0.8px; margin-top: 2px; }

    .nav-links a { color: #475569; text-decoration: none; margin-left: 28px; font-size: 15px; font-weight: 600; transition: color 0.2s; }
    .nav-links a:hover { color: #2563eb; }

    /* Page Header Section */
    .page-header { width: 100%; text-align: center; padding: 24px 20px 8px; }
    .page-header h2 { font-size: 28px; color: #0f172a; font-weight: 800; letter-spacing: -0.5px; }
    .page-header p { font-size: 14px; color: #64748b; margin-top: 4px; }

    /* Main Container */
    .container { margin: 16px 20px 60px; width: 100%; max-width: 540px; }
    
    .card { 
      background: rgba(255, 255, 255, 0.95); 
      backdrop-filter: blur(20px); 
      border-radius: 20px; 
      border: 1px solid rgba(255, 255, 255, 1); 
      overflow: hidden;
      box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.12); 
    }

    .card-banner {
      position: relative;
      background: linear-gradient(135deg, rgba(14, 116, 144, 0.92), rgba(30, 58, 138, 0.95)), 
                  url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.15'/%3E%3C/svg%3E");
      padding: 28px 24px;
      text-align: center;
      color: #ffffff;
    }
    .card-banner h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; margin-bottom: 4px; }
    .card-banner p { font-size: 13px; color: #e0f2fe; opacity: 0.95; }

    .card-body { padding: 28px 32px; }
    
    .form-row { display: flex; gap: 14px; }
    .form-group { margin-bottom: 18px; flex: 1; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #334155; }
    
    input, select { 
      width: 100%; 
      padding: 12px 14px; 
      border-radius: 10px; 
      border: 1.5px solid #cbd5e1; 
      background: #f8fafc; 
      color: #0f172a; 
      font-size: 14px; 
      font-weight: 500;
      outline: none; 
      transition: all 0.2s ease;
    }
    input:focus, select:focus {
      border-color: #2563eb;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }
    
    button { 
      width: 100%; 
      padding: 15px; 
      border-radius: 10px; 
      border: none; 
      background: linear-gradient(135deg, #0284c7, #2563eb); 
      color: white; 
      font-weight: 700; 
      font-size: 15px; 
      cursor: pointer; 
      margin-top: 10px; 
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.35);
      transition: transform 0.2s, box-shadow 0.2s; 
    }
    button:hover { 
      transform: translateY(-2px); 
      box-shadow: 0 8px 25px rgba(37, 99, 235, 0.45); 
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <nav>
    <div class="logo">
      <a href="/" style="display: flex; align-items: center; gap: 14px; text-decoration: none;">
        <div class="logo-shield">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 22C12 22 20 18 20 12V5L12 2L4 5V12C4 18 12 22 12 22Z" fill="url(#shield-grad)" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
            <path d="M9 12L11 14L15 10" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <defs>
              <linearGradient id="shield-grad" x1="4" y1="2" x2="20" y2="22" gradientUnits="userSpaceOnUse">
                <stop stop-color="#38bdf8"/>
                <stop offset="1" stop-color="#1d4ed8"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div class="logo-text">
          <span class="brand-name">Apex Shield</span>
          <span class="brand-tagline">Protecting Legacies &bull; Est. 1978</span>
        </div>
      </a>
    </div>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/apply">Apply for Quote</a>
    </div>
  </nav>

  <div class="page-header">
    <h2>Instant Rate Calculation</h2>
    <p>Get a precise Term Life estimate customized for your coverage needs.</p>
  </div>

  <div class="container">
    <div class="card">
      <div class="card-banner">
        <h1>Term Life Application</h1>
        <p>Complete the form below to connect with an Advisor.</p>
      </div>

      <div class="card-body">
        <div class="form-row">
          <div class="form-group">
            <label>First Name *</label>
            <input type="text" id="firstName" placeholder="Jane" required>
          </div>
          <div class="form-group">
            <label>Last Name *</label>
            <input type="text" id="lastName" placeholder="Doe" required>
          </div>
        </div>

        <div class="form-group">
          <label>Email Address <span style="font-weight: 400; color: #64748b;">(Optional)</span></label>
          <input type="email" id="email" placeholder="jane.doe@example.com">
        </div>

        <div class="form-group">
          <label>Date of Birth *</label>
          <input type="date" id="dob" value="1990-01-01" required>
        </div>

        <div class="form-group">
          <label>Desired Coverage ($)</label>
          <select id="coverage">
            <option value="250000">$250,000</option>
            <option value="500000" selected>$500,000</option>
            <option value="1000000">$1,000,000</option>
          </select>
        </div>

        <div class="form-group">
          <label>Term Duration</label>
          <select id="term">
            <option value="10">10 Years</option>
            <option value="20" selected>20 Years</option>
            <option value="30">30 Years</option>
          </select>
        </div>

        <div class="form-group">
          <label>Smoker Status</label>
          <select id="smokerStatus">
            <option value="no" selected>Non-Smoker</option>
            <option value="yes">Smoker (Last 12m)</option>
          </select>
        </div>

        <button onclick="calculateQuote()">Request Advisor Consultation</button>
      </div>
    </div>
  </div>

  <script>
    async function calculateQuote() {
      const firstName = document.getElementById('firstName').value.trim();
      const lastName = document.getElementById('lastName').value.trim();
      const email = document.getElementById('email').value.trim();
      const dob = document.getElementById('dob').value;
      const coverageAmount = document.getElementById('coverage').value;
      const termYears = document.getElementById('term').value;
      const smokerStatus = document.getElementById('smokerStatus').value;

      if (!firstName || !lastName) {
        alert('Please enter your First and Last Name.');
        return;
      }

      const response = await fetch('/api/quote', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ firstName, lastName, email, dob, coverageAmount, termYears, smokerStatus })
      });
      const data = await response.json();
      
      const queryParams = new URLSearchParams({
        firstName: data.firstName || firstName,
        lastName: data.lastName || lastName,
        email: data.email || email,
        age: data.age,
        coverage: data.coverageAmount,
        term: data.termYears,
        smoker: data.smokerStatus,
        premium: data.estimatedMonthlyPremium,
        advisor: data.assignedAdvisor
      });

      window.location.href = `/quote?${queryParams.toString()}`;
    }
  </script>
</body>
</html>
